plugins { id 'com.android.application' }

android {
    namespace 'com.vladimir.photopdf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vladimir.photopdf'
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
}
